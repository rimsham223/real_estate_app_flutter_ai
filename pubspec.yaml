name: nawy_ai_app
description: "AI-powered real estate search app with Firebase AI & Gemini 2.5 Pro integration for intelligent property discovery."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.7.0
  hive_ce: ^2.12.0
  hive_ce_flutter: ^2.0.1
  path_provider: ^2.1.5
  path: ^1.8.3
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  injectable: ^2.5.1
  get_it: ^8.2.0
  logger: ^2.4.0
  mocktail: ^1.0.4
  rxdart: ^0.28.0
  bloc: ^9.0.0
  material_symbols_icons: ^4.2785.1
  cached_network_image: ^3.4.1
  firebase_core: ^4.1.0
  firebase_ai: ^3.2.0
  flutter_chat_ui: ^2.9.0
  flutter_markdown: ^0.7.7+1
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_ce_generator: ^1.6.0
  injectable_generator: ^2.4.2
  analyzer: ^7.7.1
  bloc_test: ^10.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - properties.json
    - assets/nawy_logo.png
    - assets/app_icon.png

# Flutter Native Splash Configuration
flutter_native_splash:
  color: "#0169A1"  # Primary color from AppTheme
  image: assets/nawy_logo.png
  web: true
  android: true
  ios: true
  android_12:
    color: "#1F81A5"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"  # White background
  adaptive_icon_foreground: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/nawy_logo.png"